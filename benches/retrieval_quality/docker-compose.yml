# Competitors for retrieval_quality_benchmark (#1988). Not run in CI.
#
#   docker compose -f benches/retrieval_quality/docker-compose.yml up -d
#   python3 benches/retrieval_quality/competitors.py --dataset data/beir/scifact --csv competitors.csv
#   docker compose -f benches/retrieval_quality/docker-compose.yml down -v
#
# Image tags are pinned so a rerun measures the same versions. Every service
# is single-node with security off: the comparison is retrieval quality and
# single-client latency, not a production deployment. Give each the same
# memory; run one system at a time (`up -d elasticsearch`, ...) on a quiet host
# when latency matters, so they do not compete for cores.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ports:
      - "9200:9200"
    ulimits:
      memlock: { soft: -1, hard: -1 }

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g
    ports:
      - "9201:9200"
    ulimits:
      memlock: { soft: -1, hard: -1 }

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.6
    environment:
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - CLUSTER_HOSTNAME=node1
      - QUERY_DEFAULTS_LIMIT=100
    ports:
      - "8080:8080"

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
