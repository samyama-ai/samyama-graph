[workspace]
members = [
    ".", "crates/samyama-graph-algorithms",
    "crates/samyama-optimization",
    "crates/samyama-sdk",
    "crates/samyama-gpu",
    "cli",
]
exclude = ["sdk/python"]

# Single source of truth for the release version. Every workspace crate
# inherits it via `version.workspace = true`, so a release is one edit here
# and the tag/manifest guard in publish-crate.yml has exactly one number to
# check. sdk/python is its own workspace (excluded above) and is kept in
# lockstep by hand — the same guard covers it.
[workspace.package]
version = "1.7.1"

[package]
name = "samyama"
version.workspace = true
edition = "2021"
authors = ["Samyama Graph Database Team"]
description = "High-performance distributed graph database with OpenCypher support"
license = "Apache-2.0"
repository = "https://github.com/samyama-ai/samyama-graph"

# crates.io caps a published crate at 10 MB compressed. Unexcluded, this one
# carries ~11.6 MB of case-study demo GIFs, an MP4 and benchmark screenshots.
# Those are already-compressed formats, so they do not shrink in the .crate and
# the upload is rejected outright — 19 MB of files, most of it pictures.
#
# Dropping them takes the package to ~7.2 MB of almost entirely .rs, which
# compresses several-fold. Nothing here is needed to build or use the library;
# the only embedded asset, src/http/static/, is a single HTML file and is
# untouched. The repository itself is unchanged for anyone reading it on GitHub.
exclude = [
    "*.gif",
    "*.mp4",
    "*.png",
    "*.cast",
]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.1"
thiserror = "1.0"
anyhow = "1.0"
# Faster non-cryptographic hash for performance-critical hot paths
# (aggregation hash-group, dedup sets). 2-3x throughput on simple
# integer keys vs std SipHash. Already a transitive dependency.
rustc-hash = "2"

# Query parsing
pest = "2.7"
pest_derive = "2.7"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
bytes = "1.5"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Persistence (Phase 3)
rocksdb = { version = "0.22", default-features = false, features = ["lz4", "zstd"] }
bincode = "1.3"
chrono = "0.4"
# The IANA tz database, for named time zones (`Europe/Stockholm`) in temporal
# values (#767). MIT/Apache-2.0; the embedded database is public domain.
#
# The whole database, deliberately. `chrono-tz` can subset with
# `filter-by-regex`, but subsetting to the zones the TCK happens to use would
# be tuning the engine to the benchmark -- the standing rule against benchmark
# identifiers in engine source is the same principle.
chrono-tz = "0.10"
sha2 = "0.10"

# Arrow + Parquet export (INT-05 / ML-01, #1097). Version 53 matches what
# samyama-graph-enterprise already vets and ships, so this adds no new licence
# surface -- both are Apache-2.0.
#
# `arrow` is taken with default features off and only the two enabled that the
# export needs: `ipc` for the streaming format the HTTP endpoint writes, and
# `prettyprint` left off deliberately (it pulls comfy-table for a debug
# rendering nothing here uses).
arrow = { version = "53", default-features = false, features = ["ipc"] }
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd"] }

# High Availability (Phase 4)
openraft = { version = "0.9", features = ["serde"] }
async-trait = "0.1"
serde_yaml = "0.9"

# RDF/SPARQL Support (Phase 5)
oxrdf = "0.2"              # RDF primitives (IRI, Literal, Triple, Quad)
oxiri = "0.2"              # IRI handling
rio_api = "0.8"            # RDF I/O API
rio_turtle = "0.8"         # Turtle parser/serializer
rio_xml = "0.8"            # RDF/XML parser/serializer
spargebra = "0.3"          # SPARQL 1.1 parser
sparesults = "0.2"         # SPARQL results formats
# HTTP server (for SPARQL endpoint and Visualizer)
axum = { version = "0.7", features = ["multipart"] }  # HTTP framework
tower = { version = "0.5", features = ["util"] }  # Middleware
tower-http = { version = "0.5", features = ["fs", "cors"] }
http-body-util = "0.1"     # Body utilities for HTTP testing
rust-embed = "8.0"         # Embed static assets in binary
percent-encoding = "2.3"   # URL encoding
mime = "0.3"               # MIME types

# Vector Search (Phase 6)
hnsw_rs = "0.2.1"
rand = "0.8"
regex = "1"
lru = "0.12"

# Snapshot compression
flate2 = "1.0"

# Parallel processing
rayon = "1.10"

# Optimization Engine (Phase 7)
samyama-optimization = { path = "crates/samyama-optimization", version = "1.7.1" }
uuid = { version = "1.8", features = ["v4"] }
tokio-stream = "0.1"
futures = "0.3"
samyama-graph-algorithms = { path = "crates/samyama-graph-algorithms", version = "1.7.1" }
ndarray = "0.15"
reqwest = { version = "0.13.1", features = ["json"] }

# GPU acceleration (optional; pulls the wgpu/cudarc dep tree only under --features gpu)
samyama-gpu = { path = "crates/samyama-gpu", version = "1.7.1", optional = true }

[features]
default = []
# Enable in-engine GPU acceleration. Off by default so users who do not want the
# large wgpu/cudarc dep tree never compile it. See docs/ADR/ADR-025.
gpu = ["dep:samyama-gpu", "samyama-graph-algorithms/gpu"]
# NVIDIA CUDA fast path (implies gpu). Requires a CUDA toolkit at build time.
cuda = ["gpu", "samyama-gpu/cuda"]

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"
samyama-sdk = { path = "crates/samyama-sdk", version = "1.7.1" }
http-body-util = "0.1"

# These examples carry `#[cfg(test)]` tests. Cargo defaults an example target to
# `test = false`, so without this the tests inside them compile and never run —
# `cargo test --workspace` reported them as passing by never executing them.
[[example]]
name = "unified_benchmark"
test = true

[[example]]
name = "tck_runner"
test = true

[[example]]
name = "property_bridge"
test = true

[[example]]
name = "ldbc_loader"
test = true

[[example]]
name = "aact_biomarker_extractor"
test = true

[[example]]
name = "civic_loader"
test = true

[[example]]
name = "hgnc_ensembl_loader"
test = true

[[example]]
name = "oncokb_loader"
test = true

# `ic11_probe` includes `benches/common/bench_setup.rs`, whose quiet-host check
