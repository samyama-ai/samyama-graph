name: Publish Python SDK to PyPI

# Builds and publishes the `samyama` Python package (sdk/python) when a GitHub
# Release is published.
#
# Before this existed, PyPI was updated by hand and showed it: the entire
# published history was 0.6.0 and 0.6.1, each a single
# macosx_11_0_x86_64 / CPython-3.12 wheel uploaded from a laptop. Every other
# platform fell through to the sdist and had to compile RocksDB from source.
#
# The package is a PyO3 extension, so it needs a compiled wheel per platform.
# It is built with abi3-py38 (see sdk/python/Cargo.toml), which makes one wheel
# per platform valid for CPython 3.8+ — without it this matrix would carry a
# Python-version axis as well.

on:
  release:
    types: [published]
  # The matrix only ever ran at release time, on a tag, after the tag existed:
  # every break was discovered at the one moment when the options are a hotfix
  # or a retag. v1.12.0's Windows wheel failed on a runner image that rolled
  # under us (MSVC 14.51 / Visual Studio 18) with no commit from this repo.
  # A weekly build of the same matrix publishes nothing and turns that class of
  # failure into ordinary CI noise on a Tuesday instead of a blocked release.
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi, none]
        default: testpypi
      ref:
        description: "Tag to build (empty: the ref this runs on). Lets a fixed workflow build a release whose own workflow cannot."
        type: string
        default: ""

env:
  PYTHON_SDK_DIR: sdk/python

jobs:
  wheels:
    name: wheel (${{ matrix.platform }})
    # kg-snapshots-v* data releases are Releases too, and each one failed here.
    # Only a v* tag is an engine release. `publish` needs this job, so it is
    # skipped with it.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28 (AlmaLinux 8) rather than `auto` (manylinux2014,
          # CentOS 7), whose clang is too old for bindgen. See before-script-linux.
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64
            manylinux: "2_28"
            sccache: "true"
          # Built natively on an arm runner. Cross-compiling through the
          # manylinux cross image failed twice (2026-09-07 and v1.8.0): bindgen
          # found no aarch64 sysroot headers, `bits/libc-header-start.h`.
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
            sccache: "true"
          # manylinux is meaningless off Linux, but every entry sets it so the
          # action never receives an empty string for an input it expects unset.
          # macos-13 is no longer a GitHub-hosted label; a job asking for it
          # waits for a runner that never comes. macos-15-intel is x86_64.
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            manylinux: "off"
            sccache: "true"
          # macos-14 retires 2026-11-02, and GitHub fails jobs asking for it
          # during announced brownouts before then -- the first was 2026-10-05
          # 14:00 UTC. A brownout here withholds every wheel, because `publish`
          # needs the whole matrix. macos-15 is the arm64 successor label.
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64
            manylinux: "off"
            sccache: "true"
          - platform: windows-x64
            runner: windows-2022
            target: x64
            manylinux: "off"
            sccache: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Select the release lock policy
        id: lock_policy
        shell: bash
        run: |
          set -euo pipefail
          lockfile="$PYTHON_SDK_DIR/Cargo.lock"
          if [ -f "$lockfile" ]; then
            echo 'cargo_flags=--locked' >> "$GITHUB_OUTPUT"
          else
            # A backfill may check out a tag older than this lockfile policy.
            # Only an ancestor of its introduction qualifies; a new release
            # that deletes/omits the lockfile must fail, not resolve afresh.
            introduced=$(git log --reverse --diff-filter=A --format=%H "$GITHUB_SHA" -- "$lockfile" | sed -n '1p')
            if [ -n "$introduced" ] && git merge-base --is-ancestor HEAD "$introduced"; then
              echo '::warning::legacy source predates the Python lockfile; resolving its original manifest'
              echo 'cargo_flags=' >> "$GITHUB_OUTPUT"
            else
              echo '::error::Python Cargo.lock is missing from a source that does not predate the lockfile policy'
              exit 1
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        # maturin's default floor for x86_64 macOS is 10.12. RocksDB's
        # clock_cache.cc uses aligned new/delete, "only available on macOS
        # 10.13 or newer" (80 clang errors for v1.8.0). arm64 starts at 11.0
        # and is unaffected. Ignored off macOS.
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        with:
          working-directory: ${{ env.PYTHON_SDK_DIR }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist ${{ steps.lock_policy.outputs.cargo_flags }}
          # Per-platform: windows-x64 builds without it. MSVC 14.51 (Visual
          # Studio 18, which arrived on the then-floating `windows-latest`)
          # made every rocksdb translation unit fail under the sccache wrapper
          # with
          #   c1xx: fatal error C1083: Cannot open source file: '/WX-'
          # -- cl.exe receiving `/WX-` as an input path rather than a flag.
          # The flag is in neither cc-rs nor librocksdb-sys (both checked at
          # the versions involved), so it is introduced between cc-rs and
          # cl.exe, which is where sccache sits. v1.11.0 built fine here on
          # 2026-10-05; nothing in sdk/python's native build changed between
          # the two tags, so the trigger was the toolchain, not this repo.
          #
          # The runner is pinned to windows-2022 below, so sccache would very
          # likely work again -- it stays off anyway. A cache miss costs
          # minutes on one job; this cost v1.12.0 its entire PyPI release, and
          # the pin will eventually have to move.
          sccache: ${{ matrix.sccache }}
          # librocksdb-sys generates its bindings with bindgen, which needs
          # libclang, and the manylinux images ship none: v1.8.0's x86_64 wheel
          # failed on "Unable to find libclang". Runs only in the Linux container.
          before-script-linux: dnf install -y clang

      # Every platform here is a native runner (arm64 wheels build on an arm64
      # runner, etc.) — manylinux wheels are built inside the AlmaLinux
      # container but copied back out, and install cleanly on the host
      # distro, which is the entire point of the manylinux tag. So this
      # installs and imports the exact wheel that would otherwise go straight
      # to PyPI unexamined: `maturin build` only proves the PyO3 extension
      # compiles, not that the compiled bindings actually work once loaded —
      # an ABI mismatch or a binding error only shows up by running it.
      # `shell: bash` for glob/pip syntax that behaves the same on Windows as
      # everywhere else — GitHub's windows-latest runner ships Git Bash for
      # exactly this.
      - name: Test the built wheel
        shell: bash
        working-directory: ${{ env.PYTHON_SDK_DIR }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
          # `hostperf` cases assert a timing relationship that needs a host able
          # to run two CPU-bound queries at once. They say nothing about the
          # wheel, and one failing leg here withholds *every* artifact
          # (`publish` needs the whole matrix) -- which is how v1.10.0 published
          # nothing. The nightly sweep runs them on ubuntu instead.
          python -m pytest tests/ -v -m "not hostperf"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: ${{ env.PYTHON_SDK_DIR }}/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # maturin walks up to the repository root and vendors the whole cargo
      # workspace into the sdist — the crates/ sources included — so it is
      # self-contained and does not need samyama-sdk to be on crates.io first.
      # Verified locally: ~4 MB, carrying 59 vendored crate sources plus the
      # samyama_mcp Python package.
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PYTHON_SDK_DIR }}
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ${{ env.PYTHON_SDK_DIR }}/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to ${{ github.event_name == 'release' && 'PyPI' || inputs.target }}
    needs: [wheels, sdist]
    # A dispatch to the real PyPI must build a tag: the one it runs on, as
    # tag-release.yml's does (#1249), or the one named by `ref`. From a branch
    # it would upload whatever that branch holds.
    #
    # `!cancelled()` rather than an implicit all-green `needs`: one platform
    # failing used to withhold every wheel AND the sdist, so v1.12.0 reached
    # PyPI as nothing at all over a Windows toolchain problem. That is a
    # self-inflicted outage -- five working wheels help five platforms, and the
    # sdist is the floor for the sixth. `skip-existing: true` below already
    # makes the backfill run safe once the platform is fixed, so a partial
    # upload is a release that can be completed rather than one that must be
    # redone. The matrix-complete job keeps the run red so nobody reads a
    # partial release as a clean one.
    if: >-
      !cancelled()
      && needs.sdist.result == 'success'
      && (github.event_name == 'release'
          || (inputs.target == 'testpypi')
          || (inputs.target == 'pypi' && (github.ref_type == 'tag' || startsWith(inputs.ref, 'v'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Trusted Publishing: PyPI verifies a short-lived OIDC token naming this
    # repo, this workflow file and this environment. No long-lived API token is
    # stored anywhere in GitHub. The environment name is part of what PyPI
    # checks, so renaming it means reconfiguring the trusted publisher.
    environment: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      # Says plainly which platforms a user will not find a wheel for, in the
      # run summary rather than only in a log nobody opens on a green release.
      - name: Report any platform with no wheel
        run: |
          set -euo pipefail
          declare -A want=(
            [manylinux_2_28_x86_64]=linux-x86_64 [manylinux_2_28_aarch64]=linux-aarch64
            [macosx_10_15_x86_64]=macos-x86_64   [macosx_11_0_arm64]=macos-aarch64
            [win_amd64]=windows-x64
          )
          missing=()
          for tag in "${!want[@]}"; do
            compgen -G "dist/*${tag}*.whl" > /dev/null || missing+=("${want[$tag]}")
          done
          {
            echo "### PyPI upload contents"
            echo
            for f in dist/*; do echo "- \`$(basename "$f")\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> **No wheel for: ${missing[*]}.** Those platforms fall back to the"
              echo "> sdist and must compile RocksDB from source. Fix the platform, then"
              echo "> re-dispatch with the same \`ref\`: \`skip-existing\` tops up the"
              echo "> missing files without touching what already landed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::no wheel for: ${missing[*]} -- uploading a partial set"
          fi

      # Two steps rather than one with a computed repository-url: the action
      # defaults to PyPI when the input is absent, and feeding it an empty
      # string is not the same as omitting it.
      #
      # `skip-existing` because a rerun after a partial failure should top up
      # what is missing rather than abort on the files that already landed. A
      # registry rejecting a re-upload of an identical file is not an error here.
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # Publishing a partial set is better than publishing nothing, but it must not
  # look like a clean release. This is the job that fails, after the upload, so
  # the red run is attached to the release that is actually incomplete.
  matrix-complete:
    name: every platform built
    needs: [wheels, sdist, publish]
    if: >-
      !cancelled()
      && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any platform did not build
        run: |
          set -euo pipefail
          w='${{ needs.wheels.result }}'; s='${{ needs.sdist.result }}'
          echo "wheels=$w sdist=$s publish=${{ needs.publish.result }}"
          if [ "$s" != success ]; then
            echo "::error::the sdist did not build, so nothing was published"
            exit 1
          fi
          if [ "$w" != success ]; then
            echo "::error::at least one wheel did not build. Anything that did was still published (see the publish job summary); fix the platform and re-dispatch with the same ref to top up the missing files."
            exit 1
          fi
          echo "every platform built"
