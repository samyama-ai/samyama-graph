name: Publish Python SDK to PyPI

# Builds and publishes the `samyama` Python package (sdk/python) when a GitHub
# Release is published.
#
# Before this existed, PyPI was updated by hand and showed it: the entire
# published history was 0.6.0 and 0.6.1, each a single
# macosx_11_0_x86_64 / CPython-3.12 wheel uploaded from a laptop. Every other
# platform fell through to the sdist and had to compile RocksDB from source.
#
# The package is a PyO3 extension, so it needs a compiled wheel per platform.
# It is built with abi3-py38 (see sdk/python/Cargo.toml), which makes one wheel
# per platform valid for CPython 3.8+ — without it this matrix would carry a
# Python-version axis as well.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi, none]
        default: testpypi
      ref:
        description: "Tag to build (empty: the ref this runs on). Lets a fixed workflow build a release whose own workflow cannot."
        type: string
        default: ""

env:
  PYTHON_SDK_DIR: sdk/python

jobs:
  wheels:
    name: wheel (${{ matrix.platform }})
    # kg-snapshots-v* data releases are Releases too, and each one failed here.
    # Only a v* tag is an engine release. `publish` needs this job, so it is
    # skipped with it.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28 (AlmaLinux 8) rather than `auto` (manylinux2014,
          # CentOS 7), whose clang is too old for bindgen. See before-script-linux.
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          # Built natively on an arm runner. Cross-compiling through the
          # manylinux cross image failed twice (2026-09-07 and v1.8.0): bindgen
          # found no aarch64 sysroot headers, `bits/libc-header-start.h`.
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          # manylinux is meaningless off Linux, but every entry sets it so the
          # action never receives an empty string for an input it expects unset.
          # macos-13 is no longer a GitHub-hosted label; a job asking for it
          # waits for a runner that never comes. macos-15-intel is x86_64.
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            manylinux: "off"
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64
            manylinux: "off"
          - platform: windows-x64
            runner: windows-latest
            target: x64
            manylinux: "off"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PYTHON_SDK_DIR }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"
          # librocksdb-sys generates its bindings with bindgen, which needs
          # libclang, and the manylinux images ship none: v1.8.0's x86_64 wheel
          # failed on "Unable to find libclang". Runs only in the Linux container.
          before-script-linux: dnf install -y clang

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: ${{ env.PYTHON_SDK_DIR }}/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # maturin walks up to the repository root and vendors the whole cargo
      # workspace into the sdist — the crates/ sources included — so it is
      # self-contained and does not need samyama-sdk to be on crates.io first.
      # Verified locally: ~4 MB, carrying 59 vendored crate sources plus the
      # samyama_mcp Python package.
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PYTHON_SDK_DIR }}
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ${{ env.PYTHON_SDK_DIR }}/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to ${{ github.event_name == 'release' && 'PyPI' || inputs.target }}
    needs: [wheels, sdist]
    # A dispatch to the real PyPI must build a tag: the one it runs on, as
    # tag-release.yml's does (#1249), or the one named by `ref`. From a branch
    # it would upload whatever that branch holds.
    if: >-
      github.event_name == 'release'
      || (inputs.target == 'testpypi')
      || (inputs.target == 'pypi' && (github.ref_type == 'tag' || startsWith(inputs.ref, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Trusted Publishing: PyPI verifies a short-lived OIDC token naming this
    # repo, this workflow file and this environment. No long-lived API token is
    # stored anywhere in GitHub. The environment name is part of what PyPI
    # checks, so renaming it means reconfiguring the trusted publisher.
    environment: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      # Two steps rather than one with a computed repository-url: the action
      # defaults to PyPI when the input is absent, and feeding it an empty
      # string is not the same as omitting it.
      #
      # `skip-existing` because a rerun after a partial failure should top up
      # what is missing rather than abort on the files that already landed. A
      # registry rejecting a re-upload of an identical file is not an error here.
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: github.event_name == 'release' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
