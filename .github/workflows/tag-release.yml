name: Tag Release

# Stage 2 of 2. Fires on every push to main; does nothing unless the
# workspace version in Cargo.toml is one that has no tag yet — which in
# practice means "a prepare-release.yml PR just merged." When that happens
# this is what actually cuts `vX.Y.Z`, publishes the GitHub Release, and
# dispatches publish-crate.yml, publish-pypi.yml, publish-npm.yml and
# publish-docker.yml on the new tag. It has to dispatch them: a Release made
# with GITHUB_TOKEN starts no workflows, so their `release: published`
# trigger never fires for a Release made here (v1.8.0 published nothing, #1249).
#
# This is the piece that used to be an unautomated hand step: someone edited
# version files, then separately ran `git tag` and filled in the GitHub
# Release UI, and it was easy for that second half to lag or be skipped. Once
# a version-bump commit is on main, everything past this point needs no
# further action from anyone.
#
# Guarded independently from prepare-release.yml's own checks, on purpose:
# this workflow is what actually creates the Release that four other
# workflows trust, so it re-verifies the three version sources agree rather
# than assuming the PR that produced them was correct.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"

jobs:
  tag:
    name: Tag and release if the version changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write   # gh workflow run, for the four publish workflows
      id-token: write       # Sigstore, for the release SBOM attestation
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full tag history to check what already exists

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Determine whether this push introduces a new version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          WS_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "workspace version: $WS_VERSION"

          if git rev-parse "v$WS_VERSION" >/dev/null 2>&1; then
            echo "v$WS_VERSION already tagged — nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PY_CARGO=$(grep -m1 '^version = ' sdk/python/Cargo.toml | cut -d'"' -f2)
          PY_PROJ=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          TS_PKG=$(node -p "require('./sdk/typescript/package.json').version")

          for pair in "sdk/python/Cargo.toml:$PY_CARGO" "sdk/python/pyproject.toml:$PY_PROJ" "sdk/typescript/package.json:$TS_PKG"; do
            file=${pair%%:*}; got=${pair##*:}
            if [ "$got" != "$WS_VERSION" ]; then
              echo "::error::$file is $got, workspace Cargo.toml is $WS_VERSION — refusing to tag a mismatched release"
              exit 1
            fi
          done

          echo "version=$WS_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"

      # spec 19 §2 condition 3: CH-REGRESS green on its own nightly bare-metal
      # run **and blocking the release tag**. See scripts/check_release_gate.py
      # for why the verdict lives on its own branch and why missing and stale
      # block the tag exactly as red does.
      - name: CH-REGRESS must be green and recent before a tag is cut
        if: steps.check.outputs.new == 'true'
        shell: bash
        run: |
          set -uo pipefail
          if ! git fetch origin release-gate --depth=1 2>/dev/null; then
            echo "::error::no release-gate branch — the nightly has never published a verdict"
            exit 1
          fi
          git show FETCH_HEAD:RELEASE-GATE.json > RELEASE-GATE.json
          cat RELEASE-GATE.json
          # --commit: the pass must be about this build -- measured on it, or on
          # an ancestor with no engine change since. A green verdict from an
          # older main does not vouch for engine code merged after it.
          python3 scripts/check_release_gate.py RELEASE-GATE.json --commit "$GITHUB_SHA"

      - name: Tag and publish the GitHub Release
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"

          # --generate-notes builds the changelog from merged PRs since the
          # previous release tag — no separate changelog process to maintain.
          gh release create "v$VERSION" \
            --title "Samyama Graph v$VERSION" \
            --generate-notes

      # An SBOM of the tagged source, attached to the release and signed. REL-14 and
      # TRUST-08 ask for three controls — SBOM, signed artifacts, cargo-deny clean in
      # CI — and this is the first two; the third has gated every merge since #1287.
      - name: SBOM for the tagged source
        if: steps.check.outputs.new == 'true'
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json

      - name: Attest the SBOM
        if: steps.check.outputs.new == 'true'
        uses: actions/attest-sbom@v2
        with:
          subject-path: sbom-source.spdx.json
          sbom-path: sbom-source.spdx.json

      - name: Attach the SBOM to the release
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: gh release upload "v$VERSION" sbom-source.spdx.json --clobber

      # GitHub starts no workflow from an event GITHUB_TOKEN raised, so the
      # Release above reaches none of the publish workflows. A dispatch is the
      # one exception. Each runs on the tag, so it builds exactly what was
      # tagged. If this Release is ever made with another token, the release
      # event fires as well. That is harmless: every publish skips a version
      # already on its registry, and Docker overwrites its own tags.
      - name: Dispatch the publish workflows on the new tag
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run publish-crate.yml  --ref "v$VERSION" -f dry_run=false
          gh workflow run publish-pypi.yml   --ref "v$VERSION" -f target=pypi
          gh workflow run publish-npm.yml    --ref "v$VERSION" -f dry_run=false
          gh workflow run publish-docker.yml --ref "v$VERSION"
