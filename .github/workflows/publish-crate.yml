name: Publish Crates to crates.io

# Publishes three of the six workspace crates when a GitHub Release is
# published: samyama-gpu, samyama-optimization, samyama-graph-algorithms.
#
# samyama, samyama-sdk and samyama-cli are deliberately NOT published here.
# crates.io names cannot be released once claimed — only yanked — and none of
# the three have external consumers today (0 reverse dependencies on the two
# crates that do exist; see samyama-cloud#146). samyama-gpu is not optional:
# samyama-graph-algorithms carries a path dependency on it, and cargo resolves
# path dependency `version`s against the real index even when the feature
# gating them is off, so algorithms cannot be *packaged* until gpu is on the
# registry.
#
# Why `published` and not `created`: `created` also fires for drafts, so a
# half-written release note could ship a version. `published` is the one
# explicit "this is a release" event.
#
# Normal pushes and merges never reach this workflow — ci.yml validates, this
# publishes. That separation is deliberate: not every commit is a release.
#
# Auth is crates.io Trusted Publishing (OIDC) — see the Publish step. There is
# no long-lived secret to expire, which is what silently broke the workflow
# this replaces: CRATES_IO_TOKEN went stale in April and every release from
# then on failed on `403 Forbidden` with nobody noticing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and validate every crate, upload nothing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates
    # Knowledge-graph data releases (kg-snapshots-v*) are Releases too, and
    # every one of them failed this workflow. Only a v* tag is an engine release.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # No secret lives here — Trusted Publishing authenticates via OIDC, scoped
    # to this exact repo, workflow file and environment name. The environment
    # is kept anyway because it is what crates.io's trusted-publisher config
    # matches against, and because it can still carry reviewer/wait-timer
    # protection independently of ordinary CI.
    environment: crates
    permissions:
      id-token: write   # crates-io-auth-action exchanges this for a 30-minute crates.io token
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # crates.io rejects a re-publish of an existing version, so the tag and
      # the manifests must agree before anything is uploaded. sdk/python lives
      # outside the cargo workspace (see `exclude` in the root Cargo.toml) and
      # so cannot inherit the version — it is checked explicitly here rather
      # than trusted to stay in step.
      - name: Verify tag matches every manifest version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          cargo metadata --no-deps --format-version 1 > /tmp/meta.json

          # Select the root crate by name — cargo metadata does not promise an
          # order, so indexing into packages[] would be a silent trap.
          WS_VERSION=$(jq -r '.packages[] | select(.name == "samyama") | .version' /tmp/meta.json)
          if [ -z "$WS_VERSION" ]; then
            echo "::error::could not read the samyama version from cargo metadata"
            exit 1
          fi
          echo "workspace version: $WS_VERSION"

          # Every workspace crate inherits version.workspace, so a mismatch here
          # means someone hand-edited one back to a literal.
          MISMATCHED=$(jq -r --arg v "$WS_VERSION" \
            '.packages[] | select(.version != $v) | "  \(.name) is \(.version)"' /tmp/meta.json)
          if [ -n "$MISMATCHED" ]; then
            echo "::error::crates out of step with the workspace version $WS_VERSION"
            echo "$MISMATCHED"
            exit 1
          fi

          PY_CARGO=$(grep -m1 '^version = ' sdk/python/Cargo.toml | cut -d'"' -f2)
          PY_PROJ=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          for pair in "sdk/python/Cargo.toml:$PY_CARGO" "sdk/python/pyproject.toml:$PY_PROJ"; do
            file=${pair%%:*}; got=${pair##*:}
            if [ "$got" != "$WS_VERSION" ]; then
              echo "::error::$file is $got, workspace is $WS_VERSION"
              exit 1
            fi
          done

          # The tag being released: the Release's own, or the tag a dispatch runs
          # on (tag-release.yml dispatches this workflow, #1249). A real upload
          # must come from a tag, so a dispatch from a branch can only dry-run.
          if [ "$EVENT" = "release" ]; then
            TAG=$RELEASE_TAG
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG=$REF_NAME
          elif [ "$DRY_RUN" = "true" ]; then
            echo "dry run on branch $REF_NAME: no tag to check"
            exit 0
          else
            echo "::error::a real publish must run on a v* tag, not the branch $REF_NAME"
            exit 1
          fi
          if [ "${TAG#v}" != "$WS_VERSION" ]; then
            echo "::error::tag $TAG does not match version $WS_VERSION"
            exit 1
          fi
          echo "tag $TAG matches all manifests"

      # Exchanges this job's GitHub OIDC identity for a 30-minute crates.io
      # token, scoped to the crates whose trusted-publisher settings name this
      # repo + workflow file + `crates` environment. Nothing is written to
      # disk or logged; the action's post step revokes the token when the job
      # ends, so nothing outlives this run either way.
      #
      # 30 minutes covers the 3-crate sequence with room to spare — each
      # `cargo publish` blocks until crates.io's index confirms the upload
      # before returning, which is the slow part, and there are only three of
      # them. If a future crate list makes that tight, re-run this step mid-job
      # rather than widening the token lifetime — crates.io does not offer one.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -uo pipefail

          # Dependency order. samyama-graph-algorithms carries a path
          # dependency on samyama-gpu, and cargo resolves a path dependency's
          # `version` against the real index before it will even *package* the
          # dependent crate — so gpu has to land first regardless of whether
          # its feature is enabled. samyama-optimization has no such
          # dependency; it is listed first because it is cheap and independent.
          CRATES=(
            samyama-gpu
            samyama-optimization
            samyama-graph-algorithms
          )

          # Three, not six. The engine (`samyama`), the Rust SDK and the CLI are
          # absent because a dev-dependency cycle blocks their publish order
          # (#1056) — not because they are unwanted. A reader who counts the array
          # against the sentence below should not have to guess which is stale.
          #
          # For the same reason as the chaining, the dry run cannot be hoisted into
          # a separate up-front pass over the three: crate N's dry run only resolves once
          # crate N-1 is genuinely on the index. So each crate is validated
          # immediately before it is uploaded, and the chain advances one at a
          # time. cargo waits for each publish to appear on the index before
          # returning, so no manual sleep is needed between iterations.
          publish_crate() {
              local CRATE=$1
              echo "::group::$CRATE"

              local TMPLOG EXIT_CODE OUTPUT
              TMPLOG=$(mktemp)

              echo "--- dry run: $CRATE"
              cargo publish -p "$CRATE" --dry-run 2>&1 | tee "$TMPLOG"
              EXIT_CODE=${PIPESTATUS[0]}
              OUTPUT=$(cat "$TMPLOG")

              # A dry run of an already-published version fails on the duplicate,
              # which is a no-op for us rather than an error.
              if [ "$EXIT_CODE" -ne 0 ]; then
                  if echo "$OUTPUT" | grep -qE "already exists|already uploaded|is already published"; then
                      echo "already on crates.io — skipping"
                      rm -f "$TMPLOG"; echo "::endgroup::"; return 0
                  fi
                  echo "::error::dry run failed for $CRATE (exit $EXIT_CODE)"
                  rm -f "$TMPLOG"; echo "::endgroup::"; return "$EXIT_CODE"
              fi

              # The dry run above only proves $CRATE compiles standalone — cargo
              # resolves its dependencies from the registry for packaging, but
              # this still runs from the workspace checkout with local path
              # deps. A crate that passes CI inside the workspace can still be
              # broken for anyone who actually depends on it; this is the
              # closest check to that without unpacking the real .crate and
              # testing it in isolation, and it is cheap enough to run on
              # every crate before it ships. Runs in dry-run mode too, so a
              # validate-only dispatch still catches a real test failure.
              echo "--- test: $CRATE"
              cargo test -p "$CRATE" 2>&1 | tee "$TMPLOG"
              EXIT_CODE=${PIPESTATUS[0]}
              if [ "$EXIT_CODE" -ne 0 ]; then
                  echo "::error::tests failed for $CRATE (exit $EXIT_CODE) — refusing to publish"
                  rm -f "$TMPLOG"; echo "::endgroup::"; return "$EXIT_CODE"
              fi

              if [ "$DRY_RUN" = "true" ]; then
                  echo "DRY_RUN set — validated, not uploading"
                  rm -f "$TMPLOG"; echo "::endgroup::"; return 0
              fi

              echo "--- publish: $CRATE"
              cargo publish -p "$CRATE" 2>&1 | tee "$TMPLOG"
              EXIT_CODE=${PIPESTATUS[0]}
              OUTPUT=$(cat "$TMPLOG")
              rm -f "$TMPLOG"

              if [ "$EXIT_CODE" -eq 0 ]; then
                  echo "published $CRATE"
              elif echo "$OUTPUT" | grep -qE "already exists|already uploaded|is already published"; then
                  echo "already on crates.io — skipping"
              else
                  echo "::error::failed to publish $CRATE (exit $EXIT_CODE)"
                  echo "::endgroup::"; return "$EXIT_CODE"
              fi

              echo "::endgroup::"
          }

          for crate in "${CRATES[@]}"; do
            publish_crate "$crate" || exit $?
          done

          echo "all crates processed (DRY_RUN=$DRY_RUN)"
