name: Publish Crates to crates.io

# Publishes all six workspace crates when a GitHub Release is published, in
# dependency order (leaves first):
#
#   samyama-gpu -> samyama-graph-algorithms, samyama-optimization
#               -> samyama -> samyama-sdk -> samyama-cli
#
# Until #1056 only the first three were published. The engine, the SDK and the
# CLI were held back because `samyama` carried a *versioned* dev-dependency on
# `samyama-sdk`, which itself depends on `samyama` — a cycle no publish order
# satisfies. That dev-dependency is now path-only, which `cargo publish` strips
# from the packaged manifest, so the order above exists. crates.io names cannot
# be released once claimed — only yanked — so merging the change that added
# them here is the decision to publish them on the next v* release.
#
# Why `published` and not `created`: `created` also fires for drafts, so a
# half-written release note could ship a version. `published` is the one
# explicit "this is a release" event.
#
# Normal pushes and merges never reach this workflow — ci.yml validates, this
# publishes. That separation is deliberate: not every commit is a release.
#
# Auth is crates.io Trusted Publishing (OIDC) — see the Publish step. There is
# no long-lived secret to expire, which is what silently broke the workflow
# this replaces: CRATES_IO_TOKEN went stale in April and every release from
# then on failed on `403 Forbidden` with nobody noticing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and validate every crate, upload nothing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # Dependency order, leaves first. Every step below walks this one list, so the
  # order is stated once. A crate may only appear after everything it depends
  # on (normal and build dependencies; path-only dev-dependencies are stripped
  # at packaging and do not count).
  CRATES: samyama-gpu samyama-graph-algorithms samyama-optimization samyama samyama-sdk samyama-cli

jobs:
  publish:
    name: Publish crates
    # Knowledge-graph data releases (kg-snapshots-v*) are Releases too, and
    # every one of them failed this workflow. Only a v* tag is an engine release.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    # The engine's full test suite runs before anything is uploaded (see
    # "Test every crate"), and CI gives that suite 45 minutes on its own.
    timeout-minutes: 120

    # No secret lives here — Trusted Publishing authenticates via OIDC, scoped
    # to this exact repo, workflow file and environment name. The environment
    # is kept anyway because it is what crates.io's trusted-publisher config
    # matches against, and because it can still carry reviewer/wait-timer
    # protection independently of ordinary CI.
    environment: crates
    env:
      # Read by the tag check and by every step after it. A release is always a
      # real upload; only a dispatch can ask for a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    permissions:
      id-token: write   # crates-io-auth-action exchanges this for a 30-minute crates.io token
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # The engine now ships from here, and building it needs libclang
      # (zstd-sys). Same list as ci.yml's test job.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config libssl-dev clang libclang-dev

      # crates.io rejects a re-publish of an existing version, so the tag and
      # the manifests must agree before anything is uploaded. sdk/python lives
      # outside the cargo workspace (see `exclude` in the root Cargo.toml) and
      # so cannot inherit the version — it is checked explicitly here rather
      # than trusted to stay in step.
      - name: Verify tag matches every manifest version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          cargo metadata --no-deps --format-version 1 > /tmp/meta.json

          # Select the root crate by name — cargo metadata does not promise an
          # order, so indexing into packages[] would be a silent trap.
          WS_VERSION=$(jq -r '.packages[] | select(.name == "samyama") | .version' /tmp/meta.json)
          if [ -z "$WS_VERSION" ]; then
            echo "::error::could not read the samyama version from cargo metadata"
            exit 1
          fi
          echo "workspace version: $WS_VERSION"

          # Every workspace crate inherits version.workspace, so a mismatch here
          # means someone hand-edited one back to a literal.
          MISMATCHED=$(jq -r --arg v "$WS_VERSION" \
            '.packages[] | select(.version != $v) | "  \(.name) is \(.version)"' /tmp/meta.json)
          if [ -n "$MISMATCHED" ]; then
            echo "::error::crates out of step with the workspace version $WS_VERSION"
            echo "$MISMATCHED"
            exit 1
          fi

          PY_CARGO=$(grep -m1 '^version = ' sdk/python/Cargo.toml | cut -d'"' -f2)
          PY_PROJ=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          for pair in "sdk/python/Cargo.toml:$PY_CARGO" "sdk/python/pyproject.toml:$PY_PROJ"; do
            file=${pair%%:*}; got=${pair##*:}
            if [ "$got" != "$WS_VERSION" ]; then
              echo "::error::$file is $got, workspace is $WS_VERSION"
              exit 1
            fi
          done

          # The tag being released: the Release's own, or the tag a dispatch runs
          # on (tag-release.yml dispatches this workflow, #1249). A real upload
          # must come from a tag, so a dispatch from a branch can only dry-run.
          if [ "$EVENT" = "release" ]; then
            TAG=$RELEASE_TAG
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG=$REF_NAME
          elif [ "$DRY_RUN" = "true" ]; then
            echo "dry run on branch $REF_NAME: no tag to check"
            exit 0
          else
            echo "::error::a real publish must run on a v* tag, not the branch $REF_NAME"
            exit 1
          fi
          if [ "${TAG#v}" != "$WS_VERSION" ]; then
            echo "::error::tag $TAG does not match version $WS_VERSION"
            exit 1
          fi
          echo "tag $TAG matches all manifests"

      # A crate that passes CI inside the workspace can still be broken for
      # anyone who depends on it, so each crate's own tests run before
      # anything ships. This runs before authentication so the engine's suite
      # does not spend the 30-minute crates.io token, and in dry-run mode too,
      # so a validate-only dispatch still catches a real test failure.
      - name: Test every crate
        shell: bash
        run: |
          set -euo pipefail
          for crate in $CRATES; do
            echo "::group::test $crate"
            cargo test -p "$crate"
            echo "::endgroup::"
          done

      # Packages all six in one invocation and builds each .crate from its
      # unpacked contents — exactly what crates.io will serve. Given several
      # `-p`, cargo (>= 1.90) orders them itself and resolves each crate's
      # workspace siblings from a local overlay of the ones it has just
      # packaged, so this validates the whole chain before a single upload,
      # without needing crate N-1 to be on the index first. It is also where a
      # reintroduced cycle fails: cargo cannot order the list and the dependent
      # crate's sibling will not resolve.
      - name: Package and verify every crate
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          for crate in $CRATES; do ARGS+=(-p "$crate"); done
          cargo package "${ARGS[@]}"

      # Exchanges this job's GitHub OIDC identity for a 30-minute crates.io
      # token, scoped to the crates whose trusted-publisher settings name this
      # repo + workflow file + `crates` environment. Nothing is written to
      # disk or logged; the action's post step revokes the token when the job
      # ends, so nothing outlives this run either way.
      #
      # Only uploads happen inside the token's lifetime: the tests and the
      # verification builds ran above. Each `cargo publish` blocks until the
      # index confirms the upload, so six crates is six short waits. If that
      # ever grows tight, re-run this step mid-job rather than widening the
      # token lifetime — crates.io does not offer one.
      #
      # Each crate needs its own trusted-publisher entry on crates.io, and
      # samyama, samyama-sdk and samyama-cli do not exist there yet. If
      # crates.io will not accept that configuration for a name that has never
      # been published, their first upload is a maintainer's, with an API
      # token; every release after it runs through here.
      - name: Authenticate with crates.io
        id: auth
        if: env.DRY_RUN != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: env.DRY_RUN != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -uo pipefail

          # --no-verify: the step above already built every one of these
          # packages from its unpacked .crate, from this same checkout in this
          # same job. Verifying again would rebuild the engine twice more on
          # the token's clock and prove nothing new.
          for crate in $CRATES; do
            echo "::group::publish $crate"
            TMPLOG=$(mktemp)
            cargo publish -p "$crate" --no-verify 2>&1 | tee "$TMPLOG"
            EXIT_CODE=${PIPESTATUS[0]}
            OUTPUT=$(cat "$TMPLOG"); rm -f "$TMPLOG"

            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "published $crate"
            elif echo "$OUTPUT" | grep -qE "already exists|already uploaded|is already published"; then
              # A re-run after a partial release: the earlier crates are
              # already up, which is a no-op rather than an error.
              echo "already on crates.io — skipping"
            else
              echo "::error::failed to publish $crate (exit $EXIT_CODE)"
              echo "::endgroup::"; exit "$EXIT_CODE"
            fi
            echo "::endgroup::"
          done

          echo "all crates published"

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: echo "DRY_RUN set — every crate tested, packaged and verified; nothing uploaded"
