name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-push:
    # Only publish from a semver tag. The `release: published` trigger also
    # fires for data releases (kg-snapshots-*, paper*-kg-snapshots-*), whose
    # tags are not semver — docker/metadata-action's `type=semver` patterns
    # then match nothing, so those runs used to push a bare `latest` built
    # from whatever main happened to be, and never produced a version tag.
    # To publish by hand, dispatch this workflow with a vX.Y.Z tag as the ref.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sigstore keyless signing of the pushed image (REL-14 / TRUST-08). No key to
      # store, rotate or leak: the identity is this workflow, and the signature is
      # verifiable with `gh attestation verify`.
      id-token: write
      attestations: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/samyama-ai/samyama-graph
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # What a user pulls is the image, so that is what has to carry provenance —
      # attesting a file in the repository would sign something nobody downloads.
      - name: Attest the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/samyama-ai/samyama-graph
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # An SBOM of the image, beside the image, in the registry.
      - name: SBOM for the image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/samyama-ai/samyama-graph@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-image.spdx.json

      - name: Attest the SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ghcr.io/samyama-ai/samyama-graph
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-image.spdx.json
          push-to-registry: true

  # Run on both architectures the image is built for.
  #
  # `platforms: linux/amd64,linux/arm64` produced two images and this job
  # started one of them. An arm64 image that has never been started is an
  # image, not a release -- and it is pushed to GHCR either way, so the first
  # person to find out it does not run is whoever pulls it (#1327).
  smoke-test:
    needs: build-and-push
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    name: smoke-test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      # Auth lets the first release pull the package while it's still private.
      # GHCR packages default to private on first publish — flip to public in
      # GHCR package settings after the first release to skip needing this.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # redis-tools (provides redis-cli) is not preinstalled on ubuntu-latest.
      - name: Install redis-tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      # Pin to the version just built. Pulling `:latest` here could smoke-test
      # a different image than the one this run produced.
      - name: Pull and start container
        run: |
          docker run -d --name samyama \
            -p 6379:6379 -p 8080:8080 \
            ghcr.io/samyama-ai/samyama-graph:${{ needs.build-and-push.outputs.version }}

      - name: Wait for healthy
        run: |
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' samyama 2>/dev/null)
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            sleep 3
          done
          docker logs samyama
          exit 1

      - name: Check HTTP status endpoint
        run: curl -sf http://localhost:8080/api/status

      - name: Run a Cypher query via RESP
        run: |
          redis-cli -p 6379 GRAPH.QUERY testdb \
            "CREATE (a:Person {name:'Alice'})-[:KNOWS]->(b:Person {name:'Bob'}) RETURN a.name"

      # Always dump container logs on failure so a failing curl/redis-cli
      # step is diagnosable — without this, only the healthy-wait failure
      # prints logs.
      - name: Dump container logs on failure
        if: failure()
        run: docker logs samyama
