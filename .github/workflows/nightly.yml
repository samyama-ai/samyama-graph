name: Nightly sweep

# The full verification sweep: tests, every example, every bench, every case
# study. This is what has been catching the defects a plain `cargo test` does
# not -- an example that panics instead of saying what data it needs (#433), a
# bench reporting success while measuring nothing (#449), a case study whose
# snapshot URL was never filled in (#442).
#
# It is nightly rather than per-PR (see ci.yml for the fast lane).
#
# ONE JOB PER STAGE, LTO OFF (#1626). As a single job it was cancelled at its
# 180-minute timeout on 29 of 30 nights through September 2026, still inside the
# tests stage: `cargo test --workspace --release` links ~200 test binaries, and
# [profile.release] is fat LTO with codegen-units = 1, at -j2 on a 4-vCPU
# runner. Nothing after the tests stage had run in CI for a month. Because the
# job never succeeded, rust-cache never saved, so every night also started cold.
#
# The CARGO_PROFILE_RELEASE_* overrides below apply to this workflow only.
# Cargo.toml is untouched, so release artifacts and every published bench
# number keep fat LTO. Here they buy link time, which is all this job needs:
# it answers pass/fail, and LTO does not change program semantics (opt-level
# stays 3, so release-only code paths are still the ones tested).
#
# Off, not thin: the workspace links ~520 binaries (397 integration tests,
# 120 examples, benches). Measured on vm-1, the same 20 test binaries at -j4
# took 1,262 s with thin LTO and 115 s with LTO off (63 s vs 5.8 s each); the
# library itself took ~595 s either way. With thin LTO the branch run still
# had not finished the tests stage after 2h47m, and the examples job died.
#
# PASS/FAIL ONLY. The bench timings produced here are on a shared hosted
# runner and are not comparable between runs -- do not quote them. Published
# numbers come from a fixed machine with a recorded host, per spec 18. This
# job answers "does everything still run", not "how fast is it".

on:
  schedule:
    # 02:30 UTC daily. Off the hour to avoid the top-of-hour scheduling crowd.
    - cron: "30 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  sweep:
    name: sweep (${{ matrix.stage }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      # One stage failing must not cancel the others -- each answers its own
      # question, and a cancelled stage reads as "never ran", not "passed".
      fail-fast: false
      matrix:
        stage: [tests, examples, benches, casestudies]
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        # ~200 statically linked test binaries do not fit in the ~14 GB a hosted
        # runner leaves free. These toolchains are unused here.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-sweep-${{ matrix.stage }}

      - name: Run the ${{ matrix.stage }} stage
        id: sweep
        # --provision installs the system dependencies the script documents.
        run: ./scripts/verify-sweep.sh --provision --only ${{ matrix.stage }} --out "${{ runner.temp }}/sweep"

      - name: Upload results
        # Always: the results are most useful precisely when the step above failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-results-${{ matrix.stage }}
          path: ${{ runner.temp }}/sweep/results/
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-logs-${{ matrix.stage }}
          path: ${{ runner.temp }}/sweep/logs/
          retention-days: 14

  # The Python extension, built and then actually imported.
  #
  # ci.yml runs `cargo check` on `sdk/python` and deliberately does not select
  # `test_embedded.py` or `test_vector.py`, saying they belong in the nightly
  # sweep. They did not: there was no such job, so the only two suites that
  # load the compiled binding ran nowhere, on any branch, ever.
  #
  # `cargo check` catches a signature drift. It cannot catch a change in what
  # the binding *returns* -- the pyo3 0.29 migration rewrote every
  # `serde_json::Value` to Python conversion in `json_to_py`, and a check
  # compiles all of it whether an integer comes back as an `int` or as
  # something else entirely.
  python-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-python-extension
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install the extension
        working-directory: sdk/python
        run: |
          python -m venv .venv
          # ipython and pandas are what `test_notebook_magic.py` needs. They
          # are installed rather than left to `importorskip`, because a test
          # that skips in CI is a check that cannot fail: INT-09's magic could
          # stop registering and this job would stay green.
          .venv/bin/pip install --quiet maturin pytest ipython pandas
          VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release

      - name: Tests that need the compiled binding
        working-directory: sdk/python
        # `-p no:randomly` is not needed, but `--strict-markers` and a zero
        # tolerance for skips are: every suite named here must actually run.
        run: |
          .venv/bin/python -m pytest -q -rs \
            tests/test_embedded.py tests/test_vector.py \
            tests/test_async_client.py tests/test_notebook_magic.py \
            tests/test_connection.py tests/test_stream.py \
            | tee /tmp/pytest.out
          if grep -qE '[0-9]+ skipped' /tmp/pytest.out; then
            echo "::error::a suite skipped. These tests exist because the thing \
          they check is easy to break silently; a skip here is a green tick over \
          an unrun check."
            exit 1
          fi

      - name: The conversions themselves
        working-directory: sdk/python
        # Named types, not `assert it ran`. Every branch of `json_to_py` has a
        # row here, because that function is what a pyo3 upgrade rewrites and
        # what no compile error would report on.
        run: |
          .venv/bin/python - <<'EOF'
          import samyama
          c = samyama.SamyamaClient.embedded()
          row = c.query(
              'RETURN "txt" AS s, 7 AS i, 1.5 AS f, true AS b, null AS n, '
              '[1, 2] AS arr, {a: 1, b: [true, null]} AS obj'
          ).records[0]
          got = [type(v).__name__ for v in row]
          want = ["str", "int", "float", "bool", "NoneType", "list", "dict"]
          assert got == want, f"{got} != {want}"
          assert row[6] == {"a": 1, "b": [True, None]}, row[6]
          print("ok: every json_to_py branch returns the Python type it names")
          EOF

      - name: Summarise into the run page
        if: always()
        run: |
          {
            echo '## Nightly sweep'
            echo '```'
            cat "${{ runner.temp }}/sweep/results/run.txt" 2>/dev/null || echo "(no run.txt)"
            echo
            for f in tests examples benches case-studies; do
              echo "--- $f ---"
              cat "${{ runner.temp }}/sweep/results/$f.txt" 2>/dev/null || echo "(missing)"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
