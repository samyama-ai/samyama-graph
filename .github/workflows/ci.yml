name: CI

# The lane that gates merges. Until this existed, 2500+ tests gated nothing:
# the only workflow that ran tests was `workflow_dispatch`-only, because its
# self-hosted GPU runner is offline (#480).
#
# Two tiers, because the full sweep (scripts/verify-sweep.sh — tests, every
# example, 12 benches, 11 case studies) takes ~50 minutes. That is the right
# shape for a nightly and the wrong shape for a pull request.
#
#   this file  : fast lane, every PR and push to main
#   nightly.yml: full sweep, once a day
#
# Tests run in the dev profile deliberately. Release compilation of the test
# binaries dominates the wall clock (~8 minutes even warm); the tests
# themselves take under a second. Dev builds far faster and runs them just as
# thoroughly. Anything that genuinely needs release timings belongs in the
# nightly sweep, not here.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug symbols are the bulk of the target dir and nothing here reads them.
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # libclang is required by zstd-sys and is the single most common
        # first-build failure on a clean host (CONTRIBUTING documents it).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config libssl-dev clang libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Share the cache across jobs in this workflow; key on Cargo.lock.
          shared-key: ci-test

      # `cargo fmt --check` and `cargo clippy -D warnings` are still not hard
      # gates. Re-measured 2026-08-22: **5,958 rustfmt diffs and 769 clippy
      # warnings** (the ~5,000/~680 above were the 2026-08-16 figures — the
      # debt grew while it was described as static, which is the argument for
      # the ratchet below).
      #
      # Either gate would be red on arrival, and a permanently red gate is one
      # everybody learns to ignore. Adopting them needs a mechanical reformat
      # touching nearly every file — `git blame` stops being useful and every
      # branch in flight conflicts — which is a real decision and has not been
      # made.
      #
      # The ratchet is the half that does not need that decision: the count may
      # not rise. New code arrives clean, the backlog shrinks whenever anyone
      # touches a file, and the big-bang stays available as a deliberate choice
      # rather than a prerequisite (#487).

      - name: Tests
        # --no-fail-fast so one failing crate does not hide the rest; a PR
        # author should see every failure in one run, not one per push.
        run: cargo test --workspace --no-fail-fast

      - name: Examples and benches compile
        # The sweep runs these; here we only prove they still build, which is
        # what actually breaks when a signature changes.
        run: cargo check --workspace --all-targets

      # ---- Conformance gates (spec 18 §5: these block commits, not releases,
      # because they are fast and catch the most damaging classes).
      #
      # Each is an ordinary example that exits non-zero on failure, so it
      # gates without any bespoke CI machinery. `--release` because both are
      # seconds either way and the debug build of the engine is slow enough
      # that the dev profile dominates.

      - name: CH-IMPORT — the same graph by different paths is the same graph
        # REL-06. Builds one fixture via Cypher, a snapshot round
        # trip, and the store API, then compares 11 invariants through Cypher.
        # Carries its own canary: a deliberately-wrong graph must be detected,
        # so the suite cannot pass by comparing nothing.
        run: cargo run --release --example import_invariants

      - name: CH-DOC-EXEC — the Cypher in our documentation parses
        # DX-04. Every fenced ```cypher block in every markdown file. Blocks
        # showing clause syntax rather than whole queries opt out with
        # ```cypher,ignore, and the opt-out count is printed so it cannot grow
        # unnoticed.
        run: cargo run --release --example doc_check

      - name: CH-API — the OpenAPI document and the server describe one API
        # API-01. A documented endpoint the server does not serve is a broken
        # client; a served endpoint nobody documented is an undocumented
        # surface. #613 found one of each by hand, once. This makes it a gate
        # so the two cannot drift apart again.
        run: cargo run --release --example api_contract

      - name: CH-TCK — the openCypher pass count may not decrease
        # LANG-01 (#436). The rate went 57.2% -> 86.7% over a few days with
        # nothing stopping it going back: every fix so far has rested on this
        # number, and an unguarded number is one refactor from being wrong.
        #
        # The scenario set is pinned to tag 2024.3. Not for reproducibility in
        # the abstract — a moving denominator changes the rate without the
        # engine changing, and then nobody can tell a regression from a new
        # scenario.
        #
        # The floor is a *count*, not a percentage, for the same reason: a
        # scenario the harness learns to judge moves from "skipped" to
        # "evaluated" and shifts the percentage on its own. The count moves only
        # when the engine does.
        #
        # Raise the floor when it goes up; lowering it is allowed but must say
        # why in the same commit.
        run: |
          git clone --depth 1 --branch 2024.3             https://github.com/opencypher/openCypher.git /tmp/openCypher
          cargo run --release --example tck_runner --             --features /tmp/openCypher/tck/features --min-pass 1081

      - name: CH-DETERM-THREADS — the answer does not depend on the thread count
        # LANG-14 (#611). CH-DETERM varies the *process*, which catches a
        # RandomState seed reaching results. It says nothing about a parallel
        # operator emitting rows in a different order at 8 threads than at 1.
        #
        # This runs here rather than nightly because it is nearly free: a TCK
        # run is ~0.8 s, so three of them add ~3 s to a step whose 55 s is
        # almost entirely the clone above. #611 assumed minutes and proposed
        # deferring to nightly on that basis; the measurement says otherwise.
        #
        # It must land before morsel-driven parallel expand (PERF-06), not
        # after — a determinism gate added afterwards cannot tell a new bug
        # from a pre-existing one.
        run: ./scripts/check_thread_determinism.sh /tmp/openCypher/tck/features

      - name: LINT-RATCHET — the clippy warning count may not rise
        # A ceiling, not a clean-tree gate: the debt stops growing while what
        # to do about the existing 769 stays open (#487).
        run: ./scripts/check_lint_ratchet.sh 769

      - name: CH-ALGO-PARITY — the algorithms still agree with NetworkX
        # ALGO-02. The reference values are regenerated from NetworkX on a
        # cadence by the harness in samyama-graph-competitor-benchmarks; this
        # step re-runs the algorithms against the *recorded* answers, so it
        # catches our drift on every commit without needing Python here.
        #
        # It is therefore a regression check, not a parity check. Parity —
        # comparing against a live reference implementation — is the harness's
        # job, and the recorded file carries the date it was taken.
        run: cargo run --release --example algo_parity_check
