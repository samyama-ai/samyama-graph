name: Profile IC3/IC5/IC9 (throwaway)

# Throwaway branch `profile-ic`, never merged. The AWS account is blocked, so
# SF1 experiments for #612 run on a GitHub runner. Run 1 (34950228916) was the
# per-operator profile and perf of IC3/IC5/IC9. This run times IC5 against
# rewrites of it (examples/ic5_variants.rs) to test where its time goes.
# Runner timings are noisy; the ratios between variants on one runner are the point.

on:
  push:
    branches: [profile-ic]

jobs:
  ic5-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd libzstd-dev clang pkg-config
          nproc; free -g

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the example
        run: cargo build --release --example ic5_variants 2>&1 | tail -3

      - name: LDBC SF1
        run: |
          mkdir -p ~/ldbc && cd ~/ldbc
          curl -sSf --retry 5 -o sf1.tar.zst https://datasets.ldbcouncil.org/snb-interactive-v1/social_network-sf1-CsvBasic-LongDateFormatter.tar.zst
          tar --use-compress-program=unzstd -xf sf1.tar.zst && rm -f sf1.tar.zst

      - name: IC5 variants
        run: |
          mkdir -p out
          ./target/release/examples/ic5_variants --data-dir ~/ldbc/social_network-sf1-CsvBasic-LongDateFormatter 2>&1 | tee out/ic5-variants.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ic5-variants-sf1
          path: out/
