# The Computer Science Ontology (CSO 3.5) as a concept tree: Topic subjects,
# `superTopicOf` read as BROADER the other way round, and each
# `preferentialEquivalent` cluster merged into its preferred topic with the
# others kept as aliases. The same mapping samyama-ontologies'
# `scripts/vocab_to_graph.py` does by hand.
preset: generic
prefixes:
  cso: "http://cso.kmi.open.ac.uk/schema/cso#"
labels:
  "cso:Topic": Concept
edges:
  "cso:superTopicOf": { type: BROADER, reverse: true }
merge:
  predicate: "cso:preferentialEquivalent"
  into: object
  aliases_property: altLabel
languages: { prefer: en, others: suffix }
