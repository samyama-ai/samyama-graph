[package]
name = "samyama-graph-algorithms"
version.workspace = true
edition = "2021"
authors = ["Samyama Graph Database Team"]
description = "Graph algorithms (PageRank, WCC, BFS, Dijkstra) for Samyama Graph Database"
license = "Apache-2.0"
repository = "https://github.com/samyama-ai/samyama-graph"
keywords = ["graph", "algorithms", "pagerank", "bfs", "wcc"]
categories = ["algorithms", "science"]
readme = "README.md"

[dependencies]
# No heavy dependencies needed for pure topology
serde = { version = "1.0", features = ["derive"], optional = true }
ndarray = "0.15"
rand = "0.8"
rayon = "1.10"
# GPU backend (optional; enabled via this crate's `gpu` feature)
samyama-gpu = { path = "../samyama-gpu", version = "1.13.0", optional = true }
# Says why a GPU-eligible algorithm ran on the CPU (HW-10, #1684). Not optional: the
# default build has no GPU path, and it is the build that most needs to say so.
tracing = "0.1"
# The callsite API, to hear when the logging setup changes so a once-only
# report can be re-armed (#1936 review). Already in the tree through `tracing`.
tracing-core = "0.1"

[features]
default = []
# GPU-accelerated dispatch for PageRank/CDLP/LCC/TriangleCount. The CPU paths remain
# the source of truth; GPU is an opt-in fast path with transparent CPU fallback.
gpu = ["dep:samyama-gpu"]
# NVIDIA CUDA fast path + unified-memory (implies gpu). Requires a CUDA toolkit.
cuda = ["gpu", "samyama-gpu/cuda"]
# Wire the previously-dead optional `serde` dep to an explicit feature.
serde = ["dep:serde"]

# Paper 22 GPU experiment runners — only build under the `gpu` feature (they use
# `gpu_dispatch`), so a default `cargo build/test --workspace` skips them cleanly.
[[example]]
name = "e1_ablation"
required-features = ["gpu"]

[[example]]
name = "e3a_um_vs_copy"
required-features = ["gpu"]