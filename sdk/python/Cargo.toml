[workspace]

[package]
name = "samyama-python"
version = "1.8.0"
edition = "2021"
authors = ["Samyama Graph Database Team"]
description = "Python bindings for the Samyama Graph Database SDK"
license = "Apache-2.0"

[lib]
name = "samyama"
crate-type = ["cdylib"]

[dependencies]
# abi3-py38 builds a single stable-ABI wheel per platform that works on
# CPython 3.8+, instead of one wheel per (platform x Python version). Cuts the
# release matrix from ~25 jobs to ~5 and means a new CPython release needs no
# rebuild. Keep in step with `requires-python` in pyproject.toml.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
samyama-sdk = { path = "../../crates/samyama-sdk", version = "1.7.1" }
tokio = { version = "1.35", features = ["rt-multi-thread"] }
serde_json = "1.0"
