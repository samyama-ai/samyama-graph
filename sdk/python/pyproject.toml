[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "samyama"
version = "1.11.0"
description = "Python SDK for the Samyama Graph Database"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [{name = "Samyama Graph Database Team"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Database",
]
dependencies = [
    "fastmcp>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
samyama-mcp-serve = "samyama_mcp.cli:main"

[tool.pytest.ini_options]
# Registered so the marker does not warn. `hostperf` means "asserts a timing
# relationship that only holds on a host able to run two CPU-bound queries at
# once" -- correctness is asserted elsewhere, so it is deselected where the host
# is not known to qualify.
markers = [
    "hostperf: depends on the host's real parallelism, not on engine behaviour",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-packages = ["samyama_mcp", "samyama_aio", "samyama_nb", "samyama-stubs"]
